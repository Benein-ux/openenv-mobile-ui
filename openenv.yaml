version: "1.0"
name: "mobile_ui_auditor"
description: "A simulated mobile view hierarchy environment for UI navigation, form filling, and accessibility auditing."
domain: "Software Testing & Automation"
tags:
  - "mobile"
  - "accessibility"
  - "ui-automation"
  - "agentic-testing"

# THIS IS WHAT WAS MISSING — tells validator how to run inference and what vars to inject
inference:
  entrypoint: "python inference.py"
  env:
    - API_BASE_URL
    - API_KEY
    - MODEL_NAME

tasks:
  - id: "task_1_easy"
    name: "Enable Dark Mode"
    description: "Navigate from the Home screen to Settings and toggle the Dark Mode switch."
    difficulty: "easy"

  - id: "task_2_medium"
    name: "User Registration"
    description: "Fill out the registration form with valid data and submit it."
    difficulty: "medium"

  - id: "task_3_hard"
    name: "Accessibility Audit"
    description: "Scan the Feed UI and submit an audit report of all node_ids missing a content_description."
    difficulty: "hard"

api:
  port: 7860
  endpoints:
    step: "/step"
    reset: "/reset"
    state: "/state"
    tasks: "/tasks"
    grader: "/grader"
    baseline: "/baseline"
